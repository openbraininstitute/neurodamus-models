name: Test model compilation

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        python -m pip install NEURON-nightly

    - name: Build and install models
      run: |
        nrnivmodl -coreneuron ${{ github.workspace }}/mod

    - name: Check that all mechanisms are available in Neuron
      run: |
        ./x86_64/special -python -c "from neuron import h; assert all(hasattr(h, attr) for attr in ['ConductanceSource', 'MembraneCurrentSource', 'InhPoissonStim', 'TTXDynamicsSwitch', 'VecStim']); h.quit()"